<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSP | Document Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body data-category="ssp">
  <header class="navbar">
    <div class="nav-left">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">
          <h1>S</h1>
        </span>
        <span class="brand-title">Doc Hub</span>
      </a>
    </div>

    <div class="nav-right">
      <nav id="navLinks" class="nav-menu">
        <a href="index.html" class="nav-link">Documents</a>
        <a href="cv-ml.html" class="nav-link">CV & ML</a>
        <a href="ssp.html" class="nav-link active">SSP</a>
        <a href="fsd.html" class="nav-link">FSD</a>
      </nav>

      <a href="upload.html?category=ssp" class="primary-btn nav-upload-btn" title="Upload Document">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <span>Upload</span>
      </a>

      <!-- Theme Toggle -->
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle color theme"
        title="Switch light/dark theme">
        <span class="theme-icon-wrap" aria-hidden="true">
          <svg class="sun-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </span>
        <span class="theme-toggle-text" id="themeLabel">Dark</span>
      </button>

      <button class="menu-btn" id="menuBtn" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <main class="main-container">
    <div style="margin-bottom: 16px;">
      <a href="index.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back to All Documents</span>
      </a>
    </div>

    <div class="category-page-header">
      <div>
        <h1>SSP</h1>
        <p>SSP, CSP, awareness materials, security, and project documentation.</p>
      </div>

      <div class="category-header-actions">
        <!-- Search Box -->
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Search SSP..." aria-label="Search SSP documents" />
        </div>
      </div>
    </div>

    <div id="documentList" class="document-list"></div>
  </main>

  <!-- Delete Modal -->
  <div class="modal hidden" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <button class="modal-close" id="modalClose" aria-label="Close modal">×</button>
      <div class="danger-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <h3 id="modalTitle">Delete document?</h3>
      <p id="deleteMessage">This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="secondary-btn" id="cancelDelete" type="button">Cancel</button>
        <button class="delete-confirm-btn" id="confirmDelete" type="button">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <footer>
    <p>Document Hub • CV & ML • SSP • FSD</p>
  </footer>

  <script src="app.js"></script>
</body>

</html>
